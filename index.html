<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --acc:#4f8cff; --ok:#33d17a; --bad:#ff5a5a; --txt:#e7eaf0; --muted:#8b93a3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--txt); display:flex; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:440px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:16px;
          box-shadow:0 4px 18px rgba(0,0,0,.3); }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input[type=number], input[type=time] { width:100%; padding:11px 12px; border-radius:9px; border:1px solid #2c313c;
          background:#11141a; color:var(--txt); font-size:16px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { width:100%; border:0; border-radius:10px; padding:13px; font-size:15px; font-weight:600;
           color:#fff; cursor:pointer; margin-top:10px; transition:filter .15s; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .start { background:var(--ok); }
  .stop  { background:var(--bad); }
  .test  { background:#374151; }
  .send  { background:var(--acc); }
  .status { display:flex; align-items:center; gap:8px; font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .kv { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:3px 0; }
  .kv b { color:var(--txt); font-weight:600; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Orbit</h1>
  <div class="sub">Node controller</div>

  <!-- Connection -->
  <div class="card">
    <div class="status"><span id="dot" class="dot"></span><span id="connText">Connecting…</span></div>
    <div class="kv"><span>Node</span><b id="boardState">—</b></div>
    <div class="kv"><span>Signal</span><b id="rssi">—</b></div>
    <div class="kv"><span>Schedule</span><b id="stopState">off</b></div>
  </div>

  <!-- Controls -->
  <div class="card">
    <div class="row">
      <div>
        <label>Interval (minutes)</label>
        <input id="interval" type="number" min="0.1" step="0.1" value="5" />
      </div>
      <div>
        <label>Angle (°)</label>
        <input id="angle" type="number" min="0" max="180" value="60" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Work start</label>
        <input id="workStart" type="time" value="09:00" />
      </div>
      <div>
        <label>Work end</label>
        <input id="workEnd" type="time" value="17:00" />
      </div>
    </div>

    <button class="send" onclick="sendConfig()">Apply settings</button>

    <div class="row" style="margin-top:6px;">
      <div><button class="start" onclick="startWorkday()">▶ Start</button></div>
      <div><button class="stop"  onclick="stopRun()">■ Stop</button></div>
    </div>

    <div class="sub" style="margin:14px 0 0;">
      Start runs a natural rhythm for the day: jittered cadence, a lunch pause
      (12:00–13:00) and occasional short breaks, then stops on its own at
      Work end. Keeps going even if you close this page.
    </div>
  </div>
</div>

<!-- client -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  // ===== CONFIG — must match the node =====
  const HOST  = "e258e4afe426452d967a84e28ee660c9.s1.eu.hivemq.cloud";
  const PORT  = 8884;                       // WebSocket-Secure port
  const USER  = "webpage";
  const PASS  = "P£0'c1W5~,-z";
  const TOPIC_CMD   = "orbit/7q3m9k/cmd";
  const TOPIC_STATE = "orbit/7q3m9k/state";
  // ========================================

  const url = `wss://${HOST}:${PORT}/mqtt`;
  const client = mqtt.connect(url, {
    username: USER,
    password: PASS,
    clientId: "ctrl-" + Math.random().toString(16).slice(2, 8),
    reconnectPeriod: 2000,
  });

  const $ = id => document.getElementById(id);

  client.on("connect", () => {
    $("dot").classList.add("on");
    $("connText").textContent = "Connected";
    client.subscribe(TOPIC_STATE);
  });
  client.on("reconnect", () => { $("connText").textContent = "Reconnecting…"; });
  client.on("close", () => {
    $("dot").classList.remove("on");
    $("connText").textContent = "Disconnected";
  });
  client.on("error", e => { $("connText").textContent = "Error: " + e.message; });

  client.on("message", (topic, msg) => {
    if (topic !== TOPIC_STATE) return;
    let s;
    try { s = JSON.parse(msg.toString()); } catch { return; }
    if (s.online === false) { $("boardState").textContent = "OFFLINE"; return; }
    if (s.workday) {
      $("boardState").textContent = "WORKDAY" + (s.phase ? " · " + s.phase : "");
    } else {
      $("boardState").textContent = s.running ? "RUNNING ▶" : "stopped";
    }
    if (s.rssi !== undefined) $("rssi").textContent = s.rssi + " dBm";
    // Reflect the node's actual values into the inputs
    if (s.intervalMs !== undefined) $("interval").value = (s.intervalMs / 60000);
    if (s.angle      !== undefined) $("angle").value    = s.angle;
    const hhmm = ep => new Date(ep * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    if (s.workday && s.workEnd > 0) {
      $("stopState").textContent = hhmm(s.workStart) + "–" + hhmm(s.workEnd);
    } else {
      $("stopState").textContent = "off";
    }
  });

  function configPayload() {
    return {
      intervalMs: Math.round(parseFloat($("interval").value) * 60000),  // minutes -> ms
      angle:      parseInt($("angle").value, 10),
    };
  }
  function pub(obj) { client.publish(TOPIC_CMD, JSON.stringify(obj)); }

  // Turn an "HH:MM" field into an absolute epoch (seconds) for today, in the
  // browser's local timezone. The device just compares epochs — no TZ math on it.
  function timeToEpochToday(hhmm, fallback) {
    const [h, m] = (hhmm || fallback).split(":").map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return Math.floor(d.getTime() / 1000);
  }

  function sendConfig() { pub(configPayload()); }

  // Start = hand the device today's work-window boundaries and let it run the
  // rhythm itself (jittered cadence, lunch pause, breaks, auto clock-out).
  function startWorkday() {
    pub({
      ...configPayload(),                                  // cadence + angle
      workday: true,
      running: true,
      workStart:  timeToEpochToday($("workStart").value, "09:00"),
      workEnd:    timeToEpochToday($("workEnd").value,   "17:00"),
      lunchStart: timeToEpochToday("12:00"),
      lunchEnd:   timeToEpochToday("13:00"),
    });
  }

  function stopRun() { pub({ running: false, workday: false }); }
</script>
</body>
</html>
