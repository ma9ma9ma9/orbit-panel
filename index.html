<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Orbit</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --acc:#4f8cff; --ok:#33d17a; --bad:#ff5a5a; --txt:#e7eaf0; --muted:#8b93a3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--txt); display:flex; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:440px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:16px;
          box-shadow:0 4px 18px rgba(0,0,0,.3); }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  label:first-child { margin-top:0; }
  input[type=number], input[type=time] { width:100%; padding:11px 12px; border-radius:9px; border:1px solid #2c313c;
          background:#11141a; color:var(--txt); font-size:16px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { width:100%; border:0; border-radius:10px; padding:13px; font-size:15px; font-weight:600;
           color:#fff; cursor:pointer; margin-top:10px; transition:filter .15s; }
  button:hover { filter:brightness(1.1); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .start { background:var(--ok); }
  .stop  { background:var(--bad); }
  .test  { background:#374151; }
  .send  { background:var(--acc); }
  .timefield { display:flex; gap:6px; }
  .timefield input { flex:1; }
  .nowbtn { width:auto; margin:0; padding:0 14px; font-size:13px; background:#374151; white-space:nowrap; }
  .status { display:flex; align-items:center; gap:8px; font-size:13px; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .kv { display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:3px 0; }
  .kv b { color:var(--txt); font-weight:600; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Connection -->
  <div class="card">
    <div class="status"><span id="dot" class="dot"></span><span>Cloud</span></div>
    <div class="status" style="margin-top:10px;"><span id="nodeDot" class="dot"></span><span id="boardState">—</span></div>
  </div>

  <!-- Controls -->
  <div class="card">
    <div class="row">
      <div>
        <label>Interval (minutes)</label>
        <input id="interval" type="number" min="0.1" step="0.1" value="5" />
      </div>
      <div>
        <label>Angle (°)</label>
        <input id="angle" type="number" min="0" max="180" value="60" />
      </div>
    </div>

    <div class="row">
      <div>
        <label>Work start</label>
        <div class="timefield">
          <input id="workStart" type="time" />
          <button type="button" class="nowbtn" onclick="setStartNow()">Now</button>
        </div>
      </div>
      <div>
        <label>Work end</label>
        <input id="workEnd" type="time" value="17:00" />
      </div>
    </div>

    <button id="toggleBtn" class="start" onclick="toggle()">▶ Start</button>
  </div>
</div>

<!-- client -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
  // ===== CONFIG — must match the node =====
  const HOST  = "e258e4afe426452d967a84e28ee660c9.s1.eu.hivemq.cloud";
  const PORT  = 8884;                       // WebSocket-Secure port
  const USER  = "webpage";
  const PASS  = "P£0'c1W5~,-z";
  const TOPIC_CMD   = "orbit/7q3m9k/cmd";
  const TOPIC_STATE = "orbit/7q3m9k/state";
  // ========================================

  const url = `wss://${HOST}:${PORT}/mqtt`;
  const client = mqtt.connect(url, {
    username: USER,
    password: PASS,
    clientId: "ctrl-" + Math.random().toString(16).slice(2, 8),
    reconnectPeriod: 2000,
  });

  const $ = id => document.getElementById(id);
  let isRunning = false;   // mirrors the node; drives the Start/Stop toggle

  client.on("connect", () => {
    $("dot").classList.add("on");
    client.subscribe(TOPIC_STATE);
  });
  client.on("reconnect", () => { $("dot").classList.remove("on"); });
  client.on("close",     () => { $("dot").classList.remove("on"); });
  client.on("error",     () => { $("dot").classList.remove("on"); });

  client.on("message", (topic, msg) => {
    if (topic !== TOPIC_STATE) return;
    let s;
    try { s = JSON.parse(msg.toString()); } catch { return; }
    if (s.online === false) {
      $("boardState").textContent = "offline";
      $("nodeDot").classList.remove("on");
      return;
    }
    isRunning = !!s.running;
    $("boardState").textContent = isRunning ? "running" : "stopped";
    $("nodeDot").classList.toggle("on", isRunning);
    const tb = $("toggleBtn");
    tb.textContent = isRunning ? "■ Stop" : "▶ Start";
    tb.className   = isRunning ? "stop" : "start";
    // Reflect the node's actual values into the inputs
    if (s.intervalMs !== undefined) $("interval").value = (s.intervalMs / 60000);
    if (s.angle      !== undefined) $("angle").value    = s.angle;
  });

  function configPayload() {
    return {
      intervalMs: Math.round(parseFloat($("interval").value) * 60000),  // minutes -> ms
      angle:      parseInt($("angle").value, 10),
    };
  }
  function pub(obj) { client.publish(TOPIC_CMD, JSON.stringify(obj)); }

  // Turn an "HH:MM" field into an absolute epoch (seconds) for today, in the
  // browser's local timezone. The device just compares epochs — no TZ math on it.
  function timeToEpochToday(hhmm, fallback) {
    const [h, m] = (hhmm || fallback).split(":").map(Number);
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return Math.floor(d.getTime() / 1000);
  }

  // Start = hand the device the current settings + work-window boundaries and
  // let it run the rhythm itself (work stretches, sleep breaks, lunch, auto stop).
  const DAY = 86400;
  function startWorkday() {
    const now = Math.floor(Date.now() / 1000);
    let ws = timeToEpochToday($("workStart").value, "09:00");
    let we = timeToEpochToday($("workEnd").value,   "17:00");
    let ls = timeToEpochToday("12:00");
    let le = timeToEpochToday("13:00");
    if (we <= ws) we += DAY;             // end before start -> overnight window
    if (we <= now) {                     // whole window already passed today...
      ws += DAY; we += DAY;              // ...so schedule it for tomorrow
      ls += DAY; le += DAY;
    }
    if (le <= ls || le < ws || ls > we) { ls = 0; le = 0; }  // no lunch if it falls outside the window
    pub({
      ...configPayload(),                // cadence + angle
      workday: true,
      running: true,
      workStart: ws,
      workEnd:   we,
      lunchStart: ls,
      lunchEnd:   le,
    });
  }

  function stopRun() { pub({ running: false, workday: false }); }

  // Single button: Start when idle, Stop when running.
  function toggle() { if (isRunning) stopRun(); else startWorkday(); }

  // "Now" affordance for Work start — set the field to the current minute.
  function setStartNow() {
    const d = new Date();
    $("workStart").value =
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  setStartNow();   // default Work start to "now" on page load
</script>
</body>
</html>
